# Cloudflare accounts and Apertium instances, used by manage.py.

# One Cloudflare login reaches both accounts; manage.py picks one per command.
# Account IDs are not secret (they're in every dashboard URL).
[accounts.test]
id = "fb7ec344edc14881af8962daa57f6ad4"
name = "UiT / Anders Lorentsen"

[accounts.prod]
id = "e2bfaf09d6fa661780cb33620a17f1cf"
name = "Giellatekno"

# Apertium instances, by codename. Each one is, in every account it's deployed
# to, its own Worker named after the instance (<instance>.<subdomain>.workers.dev),
# with an APy container and the frontend. Use names that no other Worker in the
# accounts has. `pairs` are the language pairs it serves (`manage.py pairs
# list-available` lists them; package apertium-<pair>, which often contains both
# directions). The pairs themselves live in one R2 bucket per account
# (apertium-pairs), shared by all instances, always at the newest version unless
# rolled back (`manage.py pairs`). Changing an instance's pairs needs a deploy,
# since the frontend's language menus are built from them.

# "jorgal" is North Sámi for "translate"
[instances.jorgal]
description = "North Sámi to Norwegian Bokmål, with optional AI post-cleanup"
pairs = ["sme-nob"]

[instances.tolkimine]
description = "Finnish and Estonian, both ways, with optional AI post-cleanup"
# apertium-fin-est has both fin-est and est-fin (there is no apertium-est-fin)
pairs = ["fin-est"]

# Machine translation between the Sámi languages, and North Sámi to Norwegian.
# apertium-sme-smj/-sma/-smn contain both directions; sme-sma has no plain
# sme→sma mode, only the variants sme-sma_North and sme-sma_Mid.
[instances.mt]
description = "North Sámi to and from Lule, South and Inari Sámi, and North Sámi to Norwegian Bokmål"
pairs = ["sme-smj", "sme-sma", "sme-smn", "sme-nob"]
