# Runtime config for the container, mounted at /etc/apertium-apy/apy.conf.
# A copy is baked into the image as a default; mount your own over it.
# After editing it on the VM, restart the container.

[APY]
port = 2737
lang_names = /opt/apy/app/langNames.db
# NB: options whose command-line default is None (fasttext_model, ssl_cert,
# ssl_key, missing_freqs, nonpairs_path, api_keys, wiki_*, ...) crash upstream's
# config parser (apply_config); pass those as arguments instead (see the
# Containerfile CMD, which sets --fasttext-model).
timeout = 10
num_processes = 1
max_pipes_per_pair = 1
min_pipes_per_pair = 0
max_users_per_pipe = 5
max_idle_secs = 0
restart_pipe_after = 1000
verbosity = 1

# Enables /translateLLM. The API key comes from the environment variable
# APY_LLM_API_KEY (see README). Remove this section to disable the endpoint.
[LLM]
endpoint = https://gw-uit.intark.uh-it.no/azure-openai/openai/deployments/{model}/chat/completions?api-version=2024-02-01
# The Azure *deployment* name, substituted into {model} above, not the model
# itself. Despite its name, UiT's "gpt-35-turbo" deployment runs gpt-4.1-mini
# (the cheapest one available); "gpt-4" runs the pricier gpt-4o. See
# "LLM models" in deploy/README.md.
model = gpt-35-turbo
api_key_header = api-key
temperature = 0.15
timeout = 30
max_chars = 10000
# Leave out to use the built-in default prompt. Continuation lines indented.
# prompt = ...
# Or a file next to this one, mounted into /etc/apertium-apy/ as well:
# prompt_file = llm-prompt.txt
